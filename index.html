<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorshipSync Beamer</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #110b26; cursor: none; }
  #bg { position: fixed; inset: 0; overflow: hidden; background: #110b26; }
  .blob { position: absolute; width: 110vmax; height: 110vmax; border-radius: 50%; filter: blur(4vmax); opacity: .55; }
  .b1 { background: radial-gradient(circle, #5b3fc4 0%, transparent 62%); animation: m1 41s ease-in-out infinite alternate; }
  .b2 { background: radial-gradient(circle, #a77bf3 0%, transparent 62%); animation: m2 53s ease-in-out infinite alternate; }
  .b3 { background: radial-gradient(circle, #3a4fc9 0%, transparent 62%); animation: m3 47s ease-in-out infinite alternate; }
  @keyframes m1 { from { left: -40vmax; top: -50vmax; } to { left: 30vmax; top: 10vmax; } }
  @keyframes m2 { from { left: 40vmax; top: 10vmax; } to { left: -30vmax; top: -40vmax; } }
  @keyframes m3 { from { left: 10vmax; top: -60vmax; } to { left: -20vmax; top: 20vmax; } }
  #custom { position: fixed; inset: 0; opacity: 0; transition: opacity 1s ease; background: #000; }
  #custom.on { opacity: 1; }
  #custom video, #custom .img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                                 background-size: cover; background-position: center; }
  #glass { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #glass.on { display: block; }
  /* Abdunkeln nur über eigenen Bildern/Videos; der Standard-Hintergrund ist schon passend */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; transition: opacity 1s ease; }
  #custom.on ~ #shade { opacity: 1; }
  /* Vignette über eigenen Bildern/Videos (der Standard-Hintergrund rechnet sie im Shader) */
  #vig { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease; }
  #custom.on ~ #vig { opacity: 1; }
  .layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           padding: 0 5vw; box-sizing: border-box; opacity: 0; transition: opacity .6s ease; text-align: center;
           font-family: "Roboto", "Noto Sans", Arial, sans-serif; }
  .layer.on { opacity: 1; }
  .l1 { color: #fff; font-weight: 700; line-height: 1.22; text-shadow: 0 .3vh .8vh rgba(0,0,0,.8); }
  .ref { color: rgba(255,255,255,.7); font-weight: 600; letter-spacing: .02em; text-shadow: 0 .3vh .8vh rgba(0,0,0,.8); }
  .p1 { color: #fff; font-weight: 600; line-height: 1.3; text-shadow: 0 .3vh .8vh rgba(0,0,0,.8); max-width: 88vw; }
  .ref2 { color: rgba(255,216,102,.75); }
  .p2 { color: #ffd866; font-style: italic; line-height: 1.3; text-shadow: 0 .3vh .8vh rgba(0,0,0,.8); max-width: 88vw; }
  /* Bibeltext: breite, weiche Schattenwolke – liest sich auch auf hellen Bildstellen */
  .ref, .p1, .p2 { text-shadow: 0 0 1.2vh rgba(0,0,0,.95), 0 0 3vh rgba(0,0,0,.85), 0 0 6vh rgba(0,0,0,.6), 0 .3vh .8vh rgba(0,0,0,.9); }
  .l2 { color: #ffd866; font-style: italic; line-height: 1.22; text-shadow: 0 .3vh .8vh rgba(0,0,0,.8); }
  #credit { position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center; color: rgba(255,255,255,.8); font: italic 400 2.6vh "Roboto", Arial, sans-serif;
            text-shadow: 0 .2vh .6vh rgba(0,0,0,.8); opacity: 0; transition: opacity .6s ease; padding: 0 4vw; }
  #credit.on { opacity: 1; }
  #idle { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.75);
          font: 600 3.2vh Arial, sans-serif; text-align: center; transition: opacity .6s ease; }
  /* Bildschirm-Schriften (SIL OFL, Dateien in fonts/), Auswahl per "f" in der Textnachricht */
  @font-face { font-family: "WS1 montserrat"; src: url(fonts/Montserrat-SemiBold.ttf); font-weight: 100 900; }
  @font-face { font-family: "WS2 montserrat"; src: url(fonts/Montserrat-MediumItalic.ttf); font-style: italic; font-weight: 100 900; }
  @font-face { font-family: "WS1 inter"; src: url(fonts/Inter-SemiBold.otf); font-weight: 100 900; }
  @font-face { font-family: "WS2 inter"; src: url(fonts/Inter-MediumItalic.otf); font-style: italic; font-weight: 100 900; }
  @font-face { font-family: "WS1 nunito"; src: url(fonts/NunitoSans-SemiBold.ttf); font-weight: 100 900; }
  @font-face { font-family: "WS2 nunito"; src: url(fonts/NunitoSans-Italic.ttf); font-style: italic; font-weight: 100 900; }
  @font-face { font-family: "WS1 manrope"; src: url(fonts/Manrope-SemiBold.ttf); font-weight: 100 900; }
  @font-face { font-family: "WS2 manrope"; src: url(fonts/Manrope-Medium.ttf); font-weight: 100 900; }
  :root { --f1: "WS1 montserrat", Roboto, Arial, sans-serif; --f2: "WS2 montserrat", Roboto, Arial, sans-serif; }
  .l1, .ref, .p1 { font-family: var(--f1); }
  .l2, .p2, .ref2 { font-family: var(--f2); }
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><canvas id="glass"></canvas></div>
<div id="custom"></div>
<canvas id="vig"></canvas><div id="shade"></div>
<div id="idle">WorshipSync<br><span style="font-weight:400;font-size:2.4vh">bereit – bitte am Tablet ein Lied oder eine Bibelstelle wählen</span></div>
<div class="layer" id="L0"></div>
<div class="layer" id="L1"></div>
<div id="credit"></div>
<script>
  "use strict";
  var NS = "urn:x-cast:de.sergio.worshipsync";
  var RATIO2 = 0.72, SPACING = 1.22, PAIR_GAP = 0.34;
  var layers = [document.getElementById("L0"), document.getElementById("L1")];
  var active = 0, visible = false, shown = ["", ""];
  var measure = document.createElement("canvas").getContext("2d");

  // ---------- Schrift (gleich wie ScreenFont.java am Tablet) ----------
  var FONTS = { montserrat: 1, inter: 1, nunito: 1, manrope: 1, system: 1 };
  var fontKey = "montserrat", FONT1 = "", FONT2 = "";
  function setFont(k) {
    if (!FONTS[k]) k = "montserrat";
    if (k === fontKey && FONT1) return false;
    fontKey = k;
    if (k === "system") { FONT1 = 'Roboto, Arial, sans-serif'; FONT2 = FONT1; }
    else { FONT1 = '"WS1 ' + k + '", Roboto, Arial, sans-serif'; FONT2 = '"WS2 ' + k + '", Roboto, Arial, sans-serif'; }
    document.documentElement.style.setProperty("--f1", FONT1);
    document.documentElement.style.setProperty("--f2", FONT2);
    if (document.fonts && document.fonts.load && k !== "system") {
      // erst messen, wenn die Schrift geladen ist – sonst stimmt die Größe nicht
      Promise.all([document.fonts.load("700 40px " + FONT1), document.fonts.load("italic 40px " + FONT2)])
        .then(function () { if (visible) rebuild(); }, function () {});
    }
    return true;
  }
  function rebuild() {
    if (shown[0].indexOf(PARA) === 0) buildPara(layers[active], shown[0], shown[1]);
    else build(layers[active], shown[0], shown[1]);
  }
  setFont("montserrat");

  function lines(t) { return t ? String(t).split("\n") : []; }

  function widest(arr, font) {
    measure.font = font;
    var m = 0;
    for (var i = 0; i < arr.length; i++) m = Math.max(m, measure.measureText(arr[i]).width);
    return m;
  }

  // Baut eine Ebene: Zeilen abwechselnd erste / zweite Sprache, Größe passend zur Wand.
  function build(el, t1, t2) {
    var a = lines(t1), b = lines(t2);
    var w = window.innerWidth, h = window.innerHeight;
    var two = a.length > 0 && b.length > 0;
    var rows = Math.max(a.length, b.length);
    var gaps = two ? rows - 1 : 0;
    var size = h * 0.085;
    var units = a.length * SPACING + b.length * RATIO2 * SPACING + gaps * PAIR_GAP;
    if (units * size > h * 0.86) size = h * 0.86 / units;
    var maxW = w * 0.80;   // Text bleibt innerhalb des weichen Randes
    var w1 = widest(a, "700 " + size + "px " + FONT1);
    if (w1 > maxW) size *= maxW / w1;
    var w2 = widest(b, "italic " + (size * RATIO2) + "px " + FONT2);
    if (w2 > maxW) size *= maxW / w2;

    el.innerHTML = "";
    for (var r = 0; r < rows; r++) {
      var last = r === rows - 1;
      if (r < a.length) {
        var d1 = document.createElement("div");
        d1.className = "l1";
        d1.textContent = a[r];
        d1.style.fontSize = size + "px";
        if (two && r >= b.length && !last) d1.style.marginBottom = (size * PAIR_GAP) + "px";
        el.appendChild(d1);
      }
      if (r < b.length) {
        var d2 = document.createElement("div");
        d2.className = "l2";
        d2.textContent = b[r];
        d2.style.fontSize = (size * RATIO2) + "px";
        if (two && !last) d2.style.marginBottom = (size * PAIR_GAP) + "px";
        el.appendChild(d2);
      }
    }
  }

  // Bibeltext: erste Zeile Stellenangabe, danach Absatz; Größe so, dass alles passt.
  var PARA = "\u00a7\u00a7";
  function buildPara(el, t1, t2) {
    var a = lines(t1.substring(2)), b = t2 ? lines(t2.substring(t2.indexOf(PARA) === 0 ? 2 : 0)) : [];
    // Jede Stellenangabe steht direkt über ihrem Vers.
    var ref = a.length ? a[0] : "", ref2 = b.length ? b[0] : "";
    var p1 = a.slice(1).join(" "), p2 = b.slice(1).join(" ");
    var h = window.innerHeight;
    el.innerHTML = "";
    var r = document.createElement("div"); r.className = "ref"; r.textContent = ref; el.appendChild(r);
    var d1 = document.createElement("div"); d1.className = "p1"; d1.textContent = p1; el.appendChild(d1);
    var d2 = null, r2 = null;
    if (p2) {
      if (ref2) { r2 = document.createElement("div"); r2.className = "ref ref2"; r2.textContent = ref2; el.appendChild(r2); }
      d2 = document.createElement("div"); d2.className = "p2"; d2.textContent = p2; el.appendChild(d2);
    }
    var size = h * 0.075;
    for (var i = 0; i < 40; i++) {
      r.style.fontSize = (size * 0.55) + "px"; r.style.marginBottom = (size * 0.5) + "px";
      d1.style.fontSize = size + "px";
      if (r2) { r2.style.fontSize = (size * 0.5) + "px"; r2.style.marginTop = (size * 0.6) + "px"; r2.style.marginBottom = (size * 0.35) + "px"; }
      if (d2) { d2.style.fontSize = (size * 0.85) + "px"; d2.style.marginTop = r2 ? "0px" : (size * 0.6) + "px"; }
      var total = r.offsetHeight + d1.offsetHeight + (r2 ? r2.offsetHeight + size * 0.95 : 0) + (d2 ? d2.offsetHeight : 0) + size * 1.1;
      if (total <= h * 0.9) break;
      size *= 0.93;
    }
  }

  function show(t1, t2) {
    t1 = t1 || ""; t2 = t2 || "";
    document.getElementById("idle").style.opacity = "0";
    if (!t1 && !t2) {
      layers[active].classList.remove("on");
      visible = false;
      return;
    }
    if (visible && t1 === shown[0] && t2 === shown[1]) return;
    var next = visible ? 1 - active : active;
    if (t1.indexOf(PARA) === 0) buildPara(layers[next], t1, t2); else build(layers[next], t1, t2);
    if (next !== active) layers[active].classList.remove("on");
    layers[next].classList.add("on");
    active = next; visible = true; shown = [t1, t2];
  }

  window.addEventListener("resize", function () {
    if (!visible) return;
    if (shown[0].indexOf(PARA) === 0) buildPara(layers[active], shown[0], shown[1]);
    else build(layers[active], shown[0], shown[1]);
  });


  window.lionLevel = 5;
  window.vigLevel = 6;   // Vignette 0…10 (wie Vignette.java), kommt als "vg"   // Stärke des Glas-Löwen 0…10, kommt als "lg" mit jeder Textnachricht
  // ---------- Standard-Hintergrund (wie „Wer schaut?“): Farbflecken + Löwe als verzerrtes Glas (wie BackgroundView.java) ----------
  (function () {
    var cv = document.getElementById("glass");
    var gl = cv.getContext("webgl") || cv.getContext("experimental-webgl");
    if (!gl) return;   // ohne WebGL bleiben die alten CSS-Farbwolken
    var VS = "attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }";
    var FS = [
      "precision mediump float;",
      "uniform vec2 res; uniform float t; uniform sampler2D map; uniform float haveMap; uniform float lion; uniform float vig;",
      "uniform vec2 bp[4];",
      "const vec3 B0 = vec3(7.,10.,30.)/255.; const vec3 B1 = vec3(20.,11.,43.)/255.; const vec3 BOT = vec3(5.,7.,20.)/255.;",
      "vec3 col(int i){ if(i==0) return vec3(47.,107.,255.)/255.; if(i==1) return vec3(138.,63.,252.)/255.;",
      "  if(i==2) return vec3(31.,181.,232.)/255.; return vec3(193.,63.,216.)/255.; }",
      "float rad(int i){ if(i==0) return .62; if(i==1) return .56; if(i==2) return .44; return .40; }",
      "vec3 bg(vec2 q, float asp){ vec3 c = mix(B0,B1,(q.x+q.y*asp*asp)/(1.+asp*asp));",
      "  for(int i=0;i<4;i++){ vec2 d = q-bp[i]; d.y*=asp; float a = clamp(1.-length(d)/rad(i),0.,1.)*(112./255.); c = mix(c,col(i),a); }",
      "  c = mix(c, BOT, clamp((q.y-.55)/.45,0.,1.)*(144./255.));",
      "  return c; }",
      "float sm(float x){ x=clamp(x,0.,1.); return x*x*(3.-2.*x); }",
      "void main(){",
      "  vec2 q = vec2(gl_FragCoord.x/res.x, 1.-gl_FragCoord.y/res.y); float asp = res.y/res.x;",
      "  vec3 c = bg(q,asp);",
      "  vec2 m = vec2((q.x-.5)/asp/.86+.5, (q.y-.5)/.86+.5);",
      "  if(haveMap>.5 && lion>0. && m.x>0. && m.x<1. && m.y>0. && m.y<1.){",
      "    vec3 s = texture2D(map,m).rgb;",
      "    vec2 d = (s.rg*255.-128.)/127.*.40*(lion/5.); d.x*=asp; float k = s.b*min(1.,lion/3.);",
      "    if(k>.004){",
      "      vec3 g = vec3(bg(q-d*.72,asp).r, bg(q-d,asp).g, bg(q-d*1.28,asp).b);",
      "      c = mix(c,g,k); } }",
      "  if(vig>0.){ float r0 = 1.48-.15*vig; float e = clamp((length((q-.5)*2.)-r0)/.6,0.,1.); c *= 1.-e*e*e*(e*(6.*e-15.)+10.); }",
      "  gl_FragColor = vec4(c,1.); }"
    ].join("\n");
    function sh(type, src) { var o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
      return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null; }
    var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) return;
    var pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
    gl.useProgram(pr);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var uRes = gl.getUniformLocation(pr, "res"), uT = gl.getUniformLocation(pr, "t"),
        uHave = gl.getUniformLocation(pr, "haveMap"), uBp = gl.getUniformLocation(pr, "bp"),
        uLion = gl.getUniformLocation(pr, "lion"), uVig = gl.getUniformLocation(pr, "vig");
    gl.uniform1f(uHave, 0);
    var img = new Image();
    img.onload = function () {
      var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.uniform1i(gl.getUniformLocation(pr, "map"), 0);
      gl.uniform1f(uHave, 1);
    };
    img.src = "lion_map.png";
    var PH = [0, 2, 4, 5], SP = [11, 9, 13, 8], bp = new Float32Array(8), last = 0;
    function size() {   // halbe Auflösung reicht für die weichen Verläufe und schont den Cast-Empfänger
      var w = Math.max(320, Math.round(window.innerWidth / 2)), h = Math.max(180, Math.round(window.innerHeight / 2));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    }
    function frame(now) {
      requestAnimationFrame(frame);
      if (now - last < 40) return;
      last = now;
      size();
      var t = now / 1000;
      for (var i = 0; i < 4; i++) {
        bp[2 * i] = 0.5 + 0.38 * Math.sin(t / SP[i] * 2 + PH[i]);
        bp[2 * i + 1] = 0.5 + 0.36 * Math.cos(t / (SP[i] + 3) * 2 + PH[i] * 1.7);
      }
      gl.uniform2f(uRes, cv.width, cv.height); gl.uniform1f(uT, t); gl.uniform2fv(uBp, bp); gl.uniform1f(uLion, window.lionLevel); gl.uniform1f(uVig, window.vigLevel);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    cv.classList.add("on");
    requestAnimationFrame(frame);
  })();

  function drawVignette() {
    var cv = document.getElementById("vig"), w = 192, h = Math.max(16, Math.round(192 * window.innerHeight / window.innerWidth));
    cv.width = w; cv.height = h;
    var ctx = cv.getContext("2d"), img = ctx.createImageData(w, h), l = window.vigLevel;
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) {
      var f = 1;
      if (l > 0) {
        var ex = ((i + .5) / w - .5) * 2, ey = ((j + .5) / h - .5) * 2, r0 = 1.48 - .15 * l;
        var e = Math.min(1, Math.max(0, (Math.sqrt(ex * ex + ey * ey) - r0) / .6));
        f = 1 - e * e * e * (e * (6 * e - 15) + 10);
      }
      img.data[(j * w + i) * 4 + 3] = Math.round((1 - f) * 255);
    }
    ctx.putImageData(img, 0, 0);
  }
  drawVignette();
  window.addEventListener("resize", drawVignette);

  // ---------- Eigener Hintergrund (Bild/Video), vom Tablet in Stücken übertragen ----------
  var bgParts = null, bgMeta = null, bgCache = {}, bgUrl = null;
  function showBg(url, mime) {
    var box = document.getElementById("custom");
    box.innerHTML = "";
    if (!url) { box.classList.remove("on"); return; }
    if (mime.indexOf("video/") === 0) {
      var v = document.createElement("video");
      v.src = url; v.muted = true; v.loop = true; v.autoplay = true;
      v.setAttribute("playsinline", ""); v.setAttribute("muted", "");
      box.appendChild(v);
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    } else {
      var d = document.createElement("div");
      d.className = "img";
      d.style.backgroundImage = "url('" + url + "')";
      box.appendChild(d);
    }
    box.classList.add("on");
  }
  function b64ToBytes(s) {
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function handleBg(data) {
    if (data.bg === "none") { showBg(null); return; }
    if (data.bg === "begin") {
      if (bgCache[data.id]) { bgParts = null; bgMeta = null; showBg(bgCache[data.id].url, bgCache[data.id].mime); return; }
      bgMeta = data; bgParts = new Array(data.n); return;
    }
    if (data.bg === "part" && bgParts) { bgParts[data.i] = b64ToBytes(data.d); return; }
    if (data.bg === "end" && bgParts && bgMeta) {
      var blob = new Blob(bgParts, { type: bgMeta.mime });
      var url = URL.createObjectURL(blob);
      bgCache[bgMeta.id] = { url: url, mime: bgMeta.mime };
      showBg(url, bgMeta.mime);
      bgParts = null; bgMeta = null;
    }
  }

  function handle(data) {
    if (typeof data === "string") { try { data = JSON.parse(data); } catch (e) { return; } }
    if (data && data.bg) { handleBg(data); return; }
    if (!data || data.t1 === undefined) return;
    if (typeof data.lg === "number") window.lionLevel = Math.max(0, Math.min(10, data.lg));
    if (typeof data.vg === "number" && data.vg !== window.vigLevel) { window.vigLevel = Math.max(0, Math.min(10, data.vg)); drawVignette(); }
    if (data.f && setFont(data.f) && visible && data.t1 === shown[0] && (data.t2 || "") === shown[1]) rebuild();
    show(data.t1, data.t2);
    var cr = document.getElementById("credit");
    if (data.t3) cr.textContent = data.t3;
    cr.className = data.t3 ? "on" : "";
  }

  // Im normalen Browser (ohne Cast) Vorschau: ?demo
  if (location.search.indexOf("demo") >= 0) {
    if (location.search.indexOf("bibel") >= 0) {
      show(PARA + "Johannes 3,16\nAlso hat Gott die Welt geliebt, daß er seinen eingeborenen Sohn gab, auf daß alle, die an ihn glauben, nicht verloren werden, sondern das ewige Leben haben.",
           PARA + "Иоанна 3:16\nИбо так возлюбил Бог мир, что отдал Сына Своего Единородного, дабы всякий верующий в Него, не погиб, но имел жизнь вечную.");
    } else {
      show("Der HERR ist mein Hirte;\nmir wird nichts mangeln.", "Господь — Пастырь мой;\nя ни в чём не буду нуждаться.");
    }
  }

  if (window.cast && cast.framework) {
    var ctx = cast.framework.CastReceiverContext.getInstance();
    ctx.addCustomMessageListener(NS, function (ev) { handle(ev.data); });
    var opts = new cast.framework.CastReceiverOptions();
    opts.disableIdleTimeout = true;
    opts.customNamespaces = {};
    opts.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
    ctx.start(opts);
  }
</script>
</body>
